[package]
name = "ssh-tui-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
fuzzy-matcher = "0.3"
glob = "0.3"
ratatui = "0.30"
shell-words = "1.1"
strip-ansi-escapes = "0.2"
tastty = "0.1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.13"
