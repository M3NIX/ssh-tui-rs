[package]
name = "ssh-tui-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bitflags = "2.6"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "5.0"
fuzzy-matcher = "0.3"
glob = "0.3"
ratatui = "0.29"
shell-words = "1.1"
strip-ansi-escapes = "0.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.13"
